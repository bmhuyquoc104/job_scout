name: scrape

on:
  schedule:
    - cron: "0 23 * * *" # daily 06:00 Saigon (UTC+7)
    - cron: "0 14 1 * *" # green list, 1st of month
  workflow_dispatch:

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  INDEED_API_KEY: ${{ secrets.INDEED_API_KEY }}

jobs:
  scrape:
    if: github.event.schedule != '0 14 1 * *'
    name: scrape (${{ matrix.source }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false # one failing source must not cancel the others
      matrix:
        source: [seek, employmenthero, indeed]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --no-dev
      - run: uv run playwright install --with-deps chromium
      - name: Scrape ${{ matrix.source }}
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          case "$SOURCE" in
            # Indeed searches "IT" and saves under one category. Glassdoor blocks GitHub's IPs, so it
            # runs locally through Airflow only.
            indeed) cats=ict ;;
            *) cats=$(uv run python -c "import asyncio; from job_scout.scraper.phases import enabled_category_slugs as e; print(*asyncio.run(e(None, '$SOURCE')))") ;;
          esac
          fail=0
          for cat in $cats; do
            uv run job_scout_scrape --category "$cat" --source "$SOURCE" || fail=1
          done
          exit $fail

  green-list:
    if: github.event.schedule == '0 14 1 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --no-dev
      - run: uv run python -m job_scout.green_list
