[project]
name = "job-scout"
version = "0.1.0"
description = "Local-first accredited jobs browser and scraper"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.30",
    "curl-cffi>=0.17.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "playwright>=1.50",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.1,<3",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
job_scout_backend = "job_scout.main:run_dev_server"
job_scout_openapi = "job_scout.main:print_openapi"
job_scout_scrape = "job_scout.scraper.main:main"

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.10",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_scout"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
